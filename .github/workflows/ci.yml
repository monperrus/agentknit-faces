name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Lint with ruff
        run: |
          # Rule selection is pinned in pyproject.toml ([tool.ruff.lint] select),
          # so any recent ruff works.
          pip install "ruff>=0.15.12"
          ruff check agent-*.py

      - name: Build wheel
        run: |
          pip install build
          ./build-modules.sh
          python -m build --wheel

      - name: Smoke-test entry points from the wheel
        run: |
          pip install uv
          uvx --from dist/agentknit_faces-*.whl python -c \
            "import agent_glm_5_3, agent_glm_4_5_air, agent_deepseek_v4_flash, agent_kimi_k3; print('faces import OK')"
